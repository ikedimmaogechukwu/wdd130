<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Enugu city illustration</title>
  <desc id="desc">A simple landscape illustration representing Enugu city with hills, buildings, and a sun.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff4ff"/>
      <stop offset="100%" stop-color="#fdf2d8"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#6aa86b"/>
      <stop offset="100%" stop-color="#3a7d4f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="660" cy="110" r="52" fill="#f9d76a"/>
  <path d="M0 330 C120 260, 220 290, 330 330 S560 400, 800 300 L800 500 L0 500 Z" fill="url(#hill)"/>
  <path d="M0 360 C150 310, 260 340, 420 360 S620 410, 800 350 L800 500 L0 500 Z" fill="#4f8f5f" opacity="0.9"/>

  <g fill="#d7e7ef">
    <rect x="110" y="220" width="40" height="90" rx="3"/>
    <rect x="160" y="200" width="55" height="110" rx="3"/>
    <rect x="222" y="235" width="34" height="75" rx="3"/>
    <rect x="267" y="215" width="70" height="95" rx="3"/>
    <rect x="350" y="190" width="52" height="120" rx="3"/>
    <rect x="408" y="225" width="44" height="85" rx="3"/>
    <rect x="468" y="210" width="58" height="100" rx="3"/>
    <rect x="535" y="230" width="40" height="80" rx="3"/>
    <rect x="588" y="205" width="64" height="105" rx="3"/>
  </g>

  <g fill="#8c9ba8">
    <rect x="122" y="260" width="16" height="16"/>
    <rect x="174" y="230" width="14" height="14"/>
    <rect x="182" y="260" width="14" height="14"/>
    <rect x="280" y="245" width="18" height="16"/>
    <rect x="370" y="220" width="18" height="16"/>
    <rect x="490" y="240" width="16" height="16"/>
    <rect x="605" y="245" width="18" height="16"/>
  </g>

  <g fill="#f3f7f9" font-family="Arial, sans-serif" font-size="42" font-weight="700">
    <text x="288" y="448">ENUGU</text>
  </g>
</svg>
