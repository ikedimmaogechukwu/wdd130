<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
      content="Contact Excitement Expedition for rafting reservations, questions about our services, and website suggestions. Find our contact information and send our team a message.">

    <title>Contact Us | Excitement Expedition</title>

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Excitement Expedition logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main class="contact-page">

        <section class="company-contact">
            <h1>Excitement Expedition</h1>

            <p>
                <strong>123 Main River Street</strong><br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <div class="contact-layout">

            <div class="map-container">
                <iframe class="contact-map"
                  src="https://www.google.com/maps?q=Kolob,Utah&output=embed"
                  title="Google Map showing the company location" loading="lazy">
                </iframe>
            </div>

            <section class="contact-form">
                <h2 class="visually-hidden">Send Us a Message</h2>

                <form action="#" method="post">

                    <label for="fullname">Name</label>

                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                      autocomplete="name" required>

                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" placeholder="Placeholder"
                      autocomplete="email" required>

                    <fieldset>
                        <legend>Message Purpose</legend>

                        <label>
                            <input type="radio" name="purpose" value="General Inquiry" required>
                            General Inquiry
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="Reservation Question">
                            Reservation Question
                        </label>

                        <label>
                            <input type="radio" name="purpose" value="Website Suggestion">
                            Website Suggestion
                        </label>
                    </fieldset>

                    <label for="message">Message</label>

                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>

                    <label class="newsletter-option" for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">Get in Touch!</button>

                </form>
            </section>

        </div>

        <section class="employee-profiles">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-gallery">

                <figure>
                    <img src="images/employee1.jpg" alt="Portrait of the company manager">

                    <figcaption>
                        John Doe — Manager
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg" alt="Portrait of the customer service officer">

                    <figcaption>
                        Jane Doe — Customer Service Officer
                    </figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg" alt="Portrait of the head rafting guide">

                    <figcaption>
                        David Doe — Head Rafting Guide
                    </figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>
            &copy; 2026 Excitement Expeditions |
            Ikedimma Ogechukwu
        </p>

        <nav class="socialmedia">

            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">

                <img src="images/facebook.jpg" alt="Facebook">
            </a>

            <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">

                <img src="images/linkedin.jpg" alt="LinkedIn">
            </a>

            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">

                <img src="images/instagram.jpg" alt="Instagram">
            </a>

        </nav>

    </footer>

</body>

</html>
